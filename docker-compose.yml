version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eloc8-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://eloc8:${POSTGRES_PASSWORD}@postgres:5432/eloc8_terminal
      - THINGSBOARD_URL=${THINGSBOARD_URL}
      - NEXT_PUBLIC_THINGSBOARD_WS_URL=${THINGSBOARD_WS_URL}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eloc8-network
    expose:
      - "3000"

  postgres:
    image: postgres:16-alpine
    container_name: eloc8-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=eloc8
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=eloc8_terminal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eloc8 -d eloc8_terminal"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eloc8-network

  nginx:
    image: nginx:alpine
    container_name: eloc8-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - eloc8-network

networks:
  eloc8-network:
    driver: bridge

volumes:
  postgres_data:
